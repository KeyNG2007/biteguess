<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分析历史 · 美食猜猜看</title>
<style>body{font:16px/1.6 system-ui;background:#f5f5f7;color:#1d1d1f;max-width:1000px;margin:32px auto;padding:0 20px}a{color:#0071e3}button{cursor:pointer;padding:8px 16px;border:1px solid #ccc;border-radius:8px;background:white;margin:4px}article{background:white;border-radius:12px;padding:20px;margin:16px 0}img{max-width:100%;max-height:300px}textarea{width:95%;height:80px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:600px){.columns{grid-template-columns:1fr}}</style>
<a href="/">← 返回识别</a><h1>分析历史</h1><p>图片和分析结果保存在服务器，删除记录时一并移除。记录时间按当前设备时区显示。</p><p id="status" role="status"></p><div id="list"></div><button id="prev">上一页</button><button id="next">下一页</button><section id="detail"></section>
<script>
let offset=0;const $=id=>document.getElementById(id);
async function request(url,options){const r=await fetch(url,options);if(!r.ok)throw Error('操作失败（'+r.status+'）');return r.json()}
function el(tag,value){const node=document.createElement(tag);if(value!==undefined)node.textContent=value;return node}
async function load(){try{const rows=await request('/api/history?limit=20&offset='+offset);$('list').replaceChildren();for(const row of rows){const card=el('article');card.append(el('p',new Date(row.created_at).toLocaleString()+' · '+(row.status==='ok'?'两路成功':'存在失败结果')),el('p',row.note||'暂无备注'));const b=el('button','查看详情');b.onclick=()=>show(row.id);card.append(b);$('list').append(card)}$('prev').disabled=offset===0;$('next').disabled=rows.length<20;$('status').textContent=rows.length?'第 '+(offset/20+1)+' 页':'暂无记录'}catch(e){$('status').textContent=e.message}}
async function show(id){try{const row=await request('/api/history/'+id),area=$('detail');area.replaceChildren(el('h2','记录详情'));const image=el('img');image.src=row.image;image.alt='分析原图';area.append(image);const columns=el('div');columns.className='columns';for(const key of ['yolo','vision']){const panel=el('article');panel.append(el('h3',key==='yolo'?'YOLO 检测':'多模态分析'));const data={...row.result[key]};if(data.image){const im=el('img');im.src=data.image;im.alt='YOLO 检测结果';panel.append(im);delete data.image}panel.append(el('pre',JSON.stringify(data,null,2)));columns.append(panel)}area.append(columns);const note=el('textarea');note.value=row.note;note.maxLength=2000;note.setAttribute('aria-label','记录备注');area.append(note);const save=el('button','保存备注');save.onclick=async()=>{try{await request('/api/history/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:note.value})});await load();$('status').textContent='备注已保存'}catch(e){$('status').textContent=e.message}};const del=el('button','删除记录');del.onclick=async()=>{if(!confirm('删除这条记录及保存的图片、结果？'))return;try{await request('/api/history/'+id,{method:'DELETE'});area.replaceChildren();await load()}catch(e){$('status').textContent=e.message}};area.append(save,del)}catch(e){$('status').textContent=e.message}}
$('prev').onclick=()=>{offset=Math.max(0,offset-20);load()};$('next').onclick=()=>{offset+=20;load()};load();
</script></html>
