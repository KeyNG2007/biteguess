<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美食猜猜看</title><style>body{font-family:system-ui;background:#f6f3ed;color:#28332b;margin:0}main{max-width:1080px;margin:40px auto;padding:20px}h1{font-size:38px}.card{background:white;border-radius:18px;padding:24px;margin:18px 0}button{background:#28734c;color:white;border:0;border-radius:10px;padding:12px 24px;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{max-width:100%;max-height:380px;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}small{color:#657269}@media(max-width:700px){.grid{grid-template-columns:1fr}}.error{color:#b02d2d}</style><main><h1>美食猜猜看 🍽️</h1><p>同一张照片，让 YOLO 和 DeepSeek 各自猜一猜。</p><small>支持米饭料理、面食、饺子、披萨、沙拉。数量表示食物区域，预测可能出错。</small><div class="card"><input id="file" type="file" accept="image/*"><p><img id="preview" hidden></p><label><input id="consent" type="checkbox"> 同意将这张图片发送给 DeepSeek 进行分析</label><p><button id="go">开始猜猜看</button> <span id="status"></span></p></div><div class="grid"><div class="card"><h2>YOLO 检测</h2><div id="yolo">等待图片</div></div><div class="card"><h2>DeepSeek 看图</h2><div id="vision">等待图片</div></div></div><div class="card"><details><summary>揭晓与记录真实答案</summary><p>根据图片核对类别、区域数量和框位置，观察误检与漏检。</p><input placeholder="输入你观察到的真实食物" style="width:90%;padding:10px"></details></div></main><script>
const $=id=>document.getElementById(id);let previewUrl;const names={rice:'米饭料理',noodles:'面食',dumplings:'饺子',pizza:'披萨',salad:'沙拉'};
$('file').onchange=()=>{if(previewUrl)URL.revokeObjectURL(previewUrl);const f=$('file').files[0];if(f){previewUrl=URL.createObjectURL(f);$('preview').src=previewUrl;$('preview').hidden=false;}};
function text(parent,value){const p=document.createElement('p');p.textContent=value;parent.appendChild(p)}
function render(id,data){const el=$(id);el.replaceChildren();if(data.status!=='ok'){text(el,data.error);el.classList.add('error');return}el.classList.remove('error');text(el,`${data.model} · ${data.seconds} 秒`);if(data.image){const im=document.createElement('img');im.src=data.image;el.appendChild(im);text(el,Object.entries(data.counts).map(([k,v])=>`${names[k]} ${v} 处`).join('，')||'未检出支持的食物');text(el,data.note)}else{const a=data.result;text(el,a.foods.map(f=>`${names[f.label]} ${f.count} 处`).join('，')||'未识别出支持的食物');text(el,a.description);text(el,`未知食物：${a.unknown_present?'有':'未报告'}；无法确定：${a.uncertain?'是':'否'}`);if(data.usage)text(el,`用量：${data.usage.total_tokens} tokens`)}}
$('go').onclick=async()=>{const f=$('file').files[0];if(!f){$('status').textContent='请先选择图片';return}if(!$('consent').checked){$('status').textContent='请确认图片发送授权';return}if(f.size>10*1024*1024){$('status').textContent='图片不能超过 10 MB';return}$('go').disabled=true;$('status').textContent='两个模型正在分析，请稍等…';const form=new FormData();form.append('file',f);try{const response=await fetch('/api/analyze',{method:'POST',body:form});const data=await response.json();if(!response.ok)throw new Error(data.detail||'请求失败');render('yolo',data.yolo);render('vision',data.vision);$('status').textContent='分析完成，看看它们是否一致'}catch(e){$('status').textContent=e.message}finally{$('go').disabled=false}};
</script></html>
